# Barter on Netlify.
# The default build is the browser-only demo (no Firebase, no server costs).
# To run on real Firebase later: set VITE_BACKEND=firebase plus the VITE_FIREBASE_* keys
# in the Netlify site's environment variables, then redeploy.
[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  VITE_BACKEND = "demo"

# Single-page app: every route serves index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
