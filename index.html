<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Barter - Trade what you have for what you need. No money needed."
    />
    <meta name="theme-color" content="#ea580c" />
    <title>Barter | Trade What You Have</title>
    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:title" content="Barter | Trade What You Have" />
    <meta
      property="og:description"
      content="Find local trades and exchange goods without spending money."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://barterapp.com" />
    <meta property="og:image" content="/og-image.jpg" />

    <!-- Preload dark mode script to prevent flash -->
    <script>
      // Initialize dark mode based on user preference
      ;(function () {
        // Check for stored theme preference
        const storedTheme = localStorage.getItem('theme')

        // Apply dark mode if stored preference is 'dark' or if no stored preference and system prefers dark
        if (
          storedTheme === 'dark' ||
          (!storedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.documentElement.classList.add('dark')
        } else {
          document.documentElement.classList.remove('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
