<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Barter | Swap goods, food, livestock and skills</title>
    <meta
      name="description"
      content="Trade what you have for what you need. Swap goods, food, livestock and skills with people near you in Zimbabwe and South Africa. Free to list. No cash needed, or add a little to balance the deal."
    />
    <meta name="theme-color" content="#ea580c" />
    <link rel="canonical" href="https://barter-zw.netlify.app/" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Barter" />

    <!-- Link previews (WhatsApp, Facebook, X) -->
    <meta property="og:site_name" content="Barter" />
    <meta property="og:title" content="Barter Zimbabwe: trade what you have for what you need" />
    <meta property="og:description" content="Swap goods, food, livestock and skills with people near you. No cash needed." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://barter-zw.netlify.app/" />
    <meta property="og:image" content="https://barter-zw.netlify.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_ZW" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Preload dark mode script to prevent flash -->
    <script>
      // Initialize dark mode based on user preference
      ;(function () {
        // Check for stored theme preference
        const storedTheme = localStorage.getItem('theme')

        // Apply dark mode if stored preference is 'dark' or if no stored preference and system prefers dark
        if (
          storedTheme === 'dark' ||
          (!storedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.documentElement.classList.add('dark-theme')
        } else {
          document.documentElement.classList.remove('dark-theme')
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
